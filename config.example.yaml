gemini:
  api_key: "YOUR_GEMINI_API_KEY"
  model: "gemini-3-flash-preview"

evolution:
  max_generations: 50  # number of generations to run
  delay_between_generations: 5   # seconds between generations
  hot_deploy_timeout: 30         # seconds to wait for new process
  api_max_retries: 2             # retry transient 429/5xx model failures

safety:
  max_backups: 20
  test_timeout: 60
