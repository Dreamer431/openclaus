gemini:
  api_key: "YOUR_GEMINI_API_KEY"
  model: "gemini-3-flash-preview"

evolution:
  max_generations: 0   # 0 = run indefinitely
  delay_between_generations: 5   # seconds between generations
  hot_deploy_timeout: 30         # seconds to wait for new process

safety:
  max_backups: 20
  protected_files:
    - bootstrap.py
    - config.yaml
    - requirements.txt
